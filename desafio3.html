<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3 - Opção de Entrega</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        #totalTexto {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h2>Forma de Entrega</h2>
    
    <div>
        <label>
            <input type="radio" name="entrega" id="balcao" checked> Balcão (Grátis)
        </label>
    </div>
    
    <div>
        <label>
            <input type="radio" name="entrega" id="delivery"> Delivery (+ R$ 8,00)
        </label>
    </div>

    <button onclick="calcularFrete()">Calcular Total</button>
    
    <p id="totalTexto">Total: R$ 20,00</p>

    <script>
        function calcularFrete() {
            let isDelivery = document.getElementById("delivery").checked;
            let total;

            if (isDelivery) {
                total = "Total com Frete: R$ 28,00";
            } else {
                total = "Total: R$ 20,00";
            }

            document.getElementById("totalTexto").innerText = total;
        }
    </script>

</body>
</html>
